name: Pre-Release

# Trigger
on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'image/**'

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip_ci]') }}
    name: Build for ${{ matrix.target-platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-platform: Android
            build-command: ./gradlew assembleGitHubRelease
            artifact-path: [ platform/android/app/build/outputs/apk/GitHub/release/*arm64-v8a*.apk,
                             platform/android/app/build/outputs/apk/GitHub/release/*armeabi-v7a*.apk,
                             platform/android/app/build/outputs/apk/GitHub/release/*x86_64*.apk,
                             'platform/android/app/build/outputs/apk/GitHub/release/*x86_[!6]*.apk',
                             platform/android/app/build/outputs/apk/GitHub/release/*universal*.apk,
                             platform/android/app/build/outputs/mapping/GitHubRelease/mapping.txt ]
            artifact-name: [ Android_arm64-v8a_GitHub,
                             Android_armeabi-v7a_GitHub,
                             Android_x86_64_GitHub,
                             Android_x86_GitHub,
                             Android_universal_GitHub,
                             Android_universal_mapping ]
          - os: macos-26
            target-platform: JVM macOS arm64
            build-command: |
              ./gradlew packageReleaseDistributionForCurrentOS
              mv shared/build/compose/binaries/main-release/dmg/*.dmg "shared/build/PodAura_${ARTIFACT_VERSION}_macOS_arm64_JVM.dmg"
            artifact-path: [ shared/build/PodAura_*_macOS_arm64_JVM.dmg ]
            artifact-name: [ macOS_arm64_JVM, Skipped, Skipped, Skipped, Skipped, Skipped ]
          - os: macos-26-intel
            target-platform: JVM macOS x64
            build-command: |
              ./gradlew packageReleaseDistributionForCurrentOS
              mv shared/build/compose/binaries/main-release/dmg/*.dmg "shared/build/PodAura_${ARTIFACT_VERSION}_macOS_x64_JVM.dmg"
            artifact-path: [ shared/build/PodAura_*_macOS_x64_JVM.dmg ]
            artifact-name: [ macOS_x64_JVM, Skipped, Skipped, Skipped, Skipped, Skipped ]
          - os: windows-latest
            target-platform: JVM Windows x64
            build-command: |
              ./gradlew :shared:createReleaseDistributable -PmicrosoftStore=false
              New-Item -ItemType Directory -Force shared/build/windows-portable | Out-Null
              Copy-Item shared/build/compose/binaries/main-release/app/PodAura shared/build/windows-portable/PodAura -Recurse
              ./gradlew :shared:createMsix -PmicrosoftStore=true
              Move-Item shared/build/PodAura.msix "shared/build/PodAura_${env:ARTIFACT_VERSION}_Windows_x64_JVM_Store.msix"
            artifact-path: [ shared/build/windows-portable/PodAura/, shared/build/PodAura_*_Windows_x64_JVM_Store.msix ]
            artifact-name: [ Windows_x64_JVM_Portable, Windows_x64_JVM_Store, Skipped, Skipped, Skipped, Skipped ]
          - os: macos-26
            target-platform: Native macOS arm64
            build-command: |
              ./gradlew packageDmgNativeReleaseMacosArm64
              mv shared/build/compose/binaries/main/native-macosArm64-release-dmg/*.dmg "shared/build/PodAura_${ARTIFACT_VERSION}_macOS_arm64_Native.dmg"
            artifact-path: [ shared/build/PodAura_*_macOS_arm64_Native.dmg ]
            artifact-name: [ macOS_arm64_Native, Skipped, Skipped, Skipped, Skipped, Skipped ]

          # The project.xcproj format requires Xcode 27.
          - os: xcode-27
            target-platform: iOS arm64
            build-command: |
              xcodebuild archive \
                -project platform/ios/PodAura.xcodeproj \
                -scheme PodAura \
                -configuration Release \
                -sdk iphoneos \
                -destination 'generic/platform=iOS' \
                -archivePath "$RUNNER_TEMP/PodAura.xcarchive" \
                ARCHS=arm64 \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                CODE_SIGN_ENTITLEMENTS="" \
                DEVELOPMENT_TEAM=""
              mkdir -p "$RUNNER_TEMP/Payload"
              cp -R "$RUNNER_TEMP/PodAura.xcarchive/Products/Applications/PodAura.app" "$RUNNER_TEMP/Payload/"
              ( cd "$RUNNER_TEMP" && zip -9 -r -y "$GITHUB_WORKSPACE/PodAura_${ARTIFACT_VERSION}_iOS_arm64_Unsigned.ipa" Payload )
            artifact-path: [ PodAura_*_iOS_arm64_Unsigned.ipa ]
            artifact-name: [ iOS_arm64_Unsigned, Skipped, Skipped, Skipped, Skipped, Skipped ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Read Artifact Version
        shell: bash
        env:
          VERSION_FILE: ${{ matrix.target-platform == 'iOS arm64' && 'platform/ios/Configuration/Config.xcconfig' || 'gradle.properties' }}
          VERSION_PROPERTY: ${{ matrix.target-platform == 'Android' && 'versionName' || matrix.target-platform == 'iOS arm64' && 'MARKETING_VERSION' || 'versionForDesktop' }}
        run: |
          ARTIFACT_VERSION=$(sed -n "s/^${VERSION_PROPERTY}=//p" "$VERSION_FILE" | tr -d '\r')
          test -n "$ARTIFACT_VERSION"
          echo "ARTIFACT_VERSION=$ARTIFACT_VERSION" >> "$GITHUB_ENV"

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        if: matrix.target-platform == 'iOS arm64'
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Install MPV build dependencies
        if: matrix.target-platform == 'iOS arm64'
        run: brew install meson ninja pkg-config

      - name: Checkout Secret
        if: matrix.target-platform == 'Android'
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.SECRET_REPO }}
          token: ${{ secrets.TOKEN }}                     # Repo token
          path: secret

      - name: Copy Secret Files
        if: matrix.target-platform == 'Android'
        run: |
          cp secret/PodAura/key.jks ./
          cp secret/PodAura/signing.properties ./
          rm -rf ./secret

      # Build
      - name: Build
        run: ${{ matrix.build-command }}

      - name: Upload Artifact - ${{ matrix.artifact-name[0] }}
        uses: actions/upload-artifact@v7
        with:
          name: PodAura_${{ env.ARTIFACT_VERSION }}_${{ matrix.artifact-name[0] }}
          path: ${{ matrix.artifact-path[0] }}
          archive: ${{ matrix.target-platform == 'JVM Windows x64' }}
          compression-level: 9

      - name: Upload Artifact - ${{ matrix.artifact-name[1] }}
        if: matrix.artifact-path[1] != null
        uses: actions/upload-artifact@v7
        with:
          name: PodAura_${{ env.ARTIFACT_VERSION }}_${{ matrix.artifact-name[1] }}
          path: ${{ matrix.artifact-path[1] }}
          archive: false

      - name: Upload Artifact - ${{ matrix.artifact-name[2] }}
        if: matrix.artifact-path[2] != null
        uses: actions/upload-artifact@v7
        with:
          name: PodAura_${{ env.ARTIFACT_VERSION }}_${{ matrix.artifact-name[2] }}
          path: ${{ matrix.artifact-path[2] }}
          archive: false

      - name: Upload Artifact - ${{ matrix.artifact-name[3] }}
        if: matrix.artifact-path[3] != null
        uses: actions/upload-artifact@v7
        with:
          name: PodAura_${{ env.ARTIFACT_VERSION }}_${{ matrix.artifact-name[3] }}
          path: ${{ matrix.artifact-path[3] }}
          archive: false

      - name: Upload Artifact - ${{ matrix.artifact-name[4] }}
        if: matrix.artifact-path[4] != null
        uses: actions/upload-artifact@v7
        with:
          name: PodAura_${{ env.ARTIFACT_VERSION }}_${{ matrix.artifact-name[4] }}
          path: ${{ matrix.artifact-path[4] }}
          archive: false

      - name: Upload Artifact - ${{ matrix.artifact-name[5] }}
        if: matrix.artifact-path[5] != null
        uses: actions/upload-artifact@v7
        with:
          name: PodAura_${{ env.ARTIFACT_VERSION }}_${{ matrix.artifact-name[5] }}
          path: ${{ matrix.artifact-path[5] }}
          archive: true
          compression-level: 9

  telegram:
    name: Post APK and IPA to Telegram
    needs: build
    if: ${{ always() && !cancelled() && needs.build.result != 'skipped' && github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[skip_post]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download Android arm64 APK
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: PodAura_*_Android_arm64-v8a_GitHub.apk
          path: telegram-artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Download iOS IPA
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: PodAura_*_iOS_arm64_Unsigned.ipa
          path: telegram-artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Post to Telegram Channel
        env:
          CHANNEL_ID: ${{ secrets.TELEGRAM_TO }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          COMMIT_MESSAGE: |+
            GitHub New CI: PodAura

            ${{ github.event.head_commit.message }}

            by ${{ github.event.head_commit.author.name }}

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.event.head_commit.url }}
        run: python3 .github/scripts/post_telegram.py
